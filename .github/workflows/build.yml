name: Build TintedMac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: List schemes and targets
        run: xcodebuild -list -project TintedMac.xcodeproj

      - name: Build with Makefile
        run: make tintedmac

      - name: Zip the .app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent TintedMac.app "$GITHUB_WORKSPACE/TintedMac.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TintedMac-macOS
          path: TintedMac.zip
